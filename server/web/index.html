<style>

// <poll>
const POLL_OPT = /^\s*[-*+]\s+(?:\(([ xX•*])\)|\[([ xX])\])?\s*(.*)$/;

function pollFind(text) {

    const m = /^```enquete(?:[ \t]+(.*))?[ \t]*$/.exec(lines[i].replace(/\r$/, ''));

function pollImgUrl(im) { if (!im) return ''; const m = /^srv-file:([\w-]+)/.exec(im.src); return m ? fileUrl(m[1]) : (/^https?:\/\//i.test(im.src) ? im.src : ''); }
// </poll>
function pollCard(seg, p) {

function mdHtml(text, pollLine) {
  const L = text.split('\n'); let out = ''; let i = 0; let para = [];

    const l = L[i]; let m;
    if ((m = l.match(/^\s*(```|~~~)/))) { flush(); if (i === pollLine) { i++; while (i < L.length && !L[i].trimStart().startsWith(m[1])) i++; i++; out += '<div class="pollslot"></div>'; continue; } const code = []; i++; while (i < L.length && !L[i].trimStart().startsWith(m[1])) code.push(L[i++]); i++; out += '<pre><code>' + esc(code.join('\n')) + '</code></pre>'; continue; }

    if ((m = l.match(/^(#{1,3})\s+(.*)$/))) { flush(); out += `<h${m[1].length + 2}>${inline(m[2])}</h${m[1].length + 2}>`; i++; continue; }

    if (/^\s*>/.test(l)) { flush(); const q = []; while (i < L.length && /^\s*>/.test(L[i])) q.push(L[i++].replace(/^\s*>\s?/, '')); out += '<blockquote>' + q.map(inline).join('<br>') + '</blockquote>'; continue; }

      flush(); const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
      out += '<table><thead><tr>' + cells(l).map((c) => `<th>${c}</th>`).join('') + '</tr></thead><tbody>'; i += 2;
      while (i < L.length && L[i].includes('|') && L[i].trim()) out += '<tr>' + cells(L[i++]).map((c) => `<td>${c}</td>`).join('') + '</tr>';
      out += '</tbody></table>'; continue;
    }
    if ((m = l.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/))) {
      flush(); const depth = Math.min(4, Math.floor(m[1].replace(/\t/g, '  ').length / 2)); const tk = m[3].match(/^\[([ xX])\]\s?(.*)$/);

}

/* ───── entrada e saída ───── */
function showLogin(msg) { $('#app').hidden = true; $('#login').hidden = false; $('#le').textContent = msg || ''; }
function logout(silent) {
  if (!silent) fetch('/api/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + S.token } }).catch(() => {});
  store.del('tt.web.token'); S.token = ''; closeEvents(); showLogin(silent ? 'Sua sessão terminou. Entre de novo.' : '');
}
$('#lf').onsubmit = async (e) => {
  e.preventDefault(); $('#le').textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('#ln').value.trim(), password: $('#lp').value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Não consegui entrar');
    S.token = j.token; store.set('tt.web.token', j.token); $('#lp').value = '';
    await start();
  } catch (x) { $('#le').textContent = x.message; }
};
$('#out').onclick = () => logout(false);

async function start() {
  try {
    S.me = await api('GET', '/api/me');
    await loadUsers();
    await loadProjects();
  } catch (e) { if (S.token) showLogin(e.message); return; }
  $('#login').hidden = true; $('#app').hidden = false;
  openEvents(); route();
}
async function loadUsers() { S.users = new Map((await api('GET', '/api/users')).map((u) => [u.id, u])); }
async function loadProjects() {
  S.projects = await api('GET', '/api/projects');
  try { S.groups = await api('GET', '/api/groups'); } catch { S.groups = []; }
  try { S.gcol = new Set(JSON.parse(store.get('tt.web.gcol') || '[]')); } catch { S.gcol = new Set(); }
  const saved = store.get('tt.web.exp');
  S.exp = new Set(saved ? JSON.parse(saved) : S.projects.map((p) => p.id));
  await Promise.all(S.projects.map((p) => loadNotes(p.id)));
  renderTree();
}
async function loadNotes(pid) { try { S.notes.set(pid, await api('GET', `/api/projects/${pid}/notes`)); } catch { S.notes.set(pid, []); } }

/* ───── lista de projetos e busca ───── */
function renderTree() {
  const box = $('#tree'); box.textContent = '';
  if (S.q) return;
  if (!S.projects.length) { box.append(el('div', 'empty', 'Você ainda não tem acesso a nenhum projeto.')); return; }
  const projRow = (p, pad) => {
    const row = el('div', 'proj'); const open = S.exp.has(p.id); row.style.paddingLeft = pad + 'px';
    row.append(el('span', null, open ? '▾' : '▸'), el('span', null, p.name));
    row.lastChild.style.flex = '1';
    const un = (S.notes.get(p.id) || []).reduce((a, n) => a + n.unread, 0);
    const mn = (S.notes.get(p.id) || []).reduce((a, n) => a + (n.mine || 0), 0);
    if (mn) row.append(el('span', 'badge mine', '@' + mn));
    if (un) row.append(el('span', 'badge', String(un)));
    row.onclick = () => { if (S.exp.has(p.id)) S.exp.delete(p.id); else S.exp.add(p.id); store.set('tt.web.exp', JSON.stringify([...S.exp])); renderTree(); };
    box.append(row);
    if (!open) return;
    const ns = S.notes.get(p.id) || [];
    if (!ns.length) box.append(Object.assign(el('div', 'empty', 'Sem notas'), { style: `padding:6px ${pad + 20}px;text-align:left` }));
    for (const n of ns) {
      const r = el('div', 'note' + (S.open && S.open.nid === n.id ? ' act' : ''));
      r.style.paddingLeft = (pad + 20) + 'px';
      r.append(el('span', 't', (n.type === 'canvas' ? '▦ ' : '') + n.title)); if (n.mine) r.append(el('span', 'badge mine', '@' + n.mine)); if (n.unread) r.append(el('span', 'badge', String(n.unread)));
      r.title = `Última alteração: ${fmt(n.updated)}`;
      r.onclick = () => { location.hash = `#/n/${p.id}/${n.id}`; };
      box.append(r);
    }
  };
  const inGroup = (p) => p.group && S.groups.some((g) => g.id === p.group);
  for (const g of S.groups) {
    const list = S.projects.filter((p) => p.group === g.id);
    if (!list.length) continue;
    const closed = S.gcol.has(g.id);
    const row = el('div', 'proj grp');
    row.append(el('span', null, closed ? '▸' : '▾'), el('span', null, '▤ ' + g.name));
    row.lastChild.style.flex = '1';
    const un = list.reduce((a, p) => a + (S.notes.get(p.id) || []).reduce((x, n) => x + n.unread, 0), 0);

}

  if (!m) { S.open = null; $('#app').classList.remove('in-note'); $('#comp').hidden = true; $('#nt').textContent = 'Selecione uma nota'; $('#list').replaceChildren(el('div', 'empty', 'Escolha uma nota na lista.')); renderTree(); return; }

  if (first) { o.readAt = n.readAt || 0; api('GET', `/api/projects/${o.pid}/people`).then((l) => { if (S.open === o) o.people = l; }).catch(() => {}); }

const grow = () => { msg.style.height = 'auto'; const h = Math.max(42, Math.min(160, msg.scrollHeight)); msg.style.height = h + 'px'; msg.style.overflowY = msg.scrollHeight > 160 ? 'auto' : 'hidden'; };
msg.addEventListener('input', () => { grow(); mentionUpdate(); });
msg.addEventListener('blur', () => setTimeout(closeMention, 150));
const touch = matchMedia('(pointer: coarse)').matches;
msg.addEventListener('keydown', (e) => {
  if (mst) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); mst.idx = (mst.idx + (e.key === 'ArrowDown' ? 1 : -1) + mst.items.length) % mst.items.length; [...$('#mpop').children].forEach((c, i) => c.classList.toggle('on', i === mst.idx)); return; }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickMention(); return; }
    if (e.key === 'Escape') { e.preventDefault(); closeMention(); return; }
  }
  if (e.key === 'Escape' && reply) { clearReply(); return; }
  if (e.key === 'Enter' && !e.isComposing && !e.shiftKey && !e.ctrlKey && !touch) { e.preventDefault(); sendMsg(); } else if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); msg.setRangeText('\n', msg.selectionStart, msg.selectionEnd, 'end'); grow(); }
});
function pinnedSegs() { const o = S.open; return o && o.note ? o.note.segments.filter((x) => x.pinned && !x.deleted).sort((a, b) => b.pinned.ts - a.pinned.ts) : []; }
function jumpSeg(id) { if (unhide(id)) renderNote(); const x = document.querySelector(`#list [data-sid="${id}"]`); if (x) { x.scrollIntoView({ block: 'center', behavior: 'smooth' }); x.classList.add('flash'); setTimeout(() => x.classList.remove('flash'), 1600); } }
$('#pinsb').onclick = () => {
  if (!S.open) return;
  const { bg, box } = sheet('📌 Mensagens fixadas'); bg.id = 'pinsheet';
  const draw = () => {
    [...box.querySelectorAll('.pinrow, .empty')].forEach((x) => x.remove());
    const pins = pinnedSegs();

      if (S.open.note.role !== 'read') { const un = el('button', 'btn', 'Desafixar'); un.onclick = () => guard(async () => { const x = await api('POST', `/api/notes/${S.open.nid}/segments/${seg.id}/pin`, { pinned: false }); delete seg.pinned; renderNote(); draw(); }); r.append(un); }
      box.append(r);

$('#send').onclick = sendMsg;
// Fotos do celular são enormes: reduz para no máximo 1920 px e salva em WebP (só usa se ficar menor)
async function optImg(file) {
  if (!/^image\/(png|jpe?g|webp|bmp)$/i.test(file.type) || file.size < 150 * 1024) return file;
  try {
    const bmp = await createImageBitmap(file); const k = Math.min(1, 1920 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 400 * 1024) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, 'image/webp', 0.86));
    if (!blob || blob.size >= file.size * 0.9) return file;
    return new File([blob], (file.name || 'imagem').replace(/\.[^.]+$/, '') + '.webp', { type: 'image/webp' });
  } catch { return file; }
}
async function pollUpload(file) {
  const f = await optImg(file); const name = f.name || 'foto.png';
  const r = await fetch(`/api/projects/${S.open.pid}/files?name=${encodeURIComponent(name)}`, { method: 'POST', headers: { Authorization: 'Bearer ' + S.token, 'Content-Type': f.type || 'application/octet-stream' }, body: f });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Falha no envio');
  return { src: 'srv-file:' + j.id, alt: name.replace(/\.[^.]+$/, '').replace(/[\[\]]/g, ' ') };
}
$('#pollb').onclick = () => {
  if (!S.open || S.open.note.role === 'read') return toast('Você só pode ler esta nota');
  const { bg, box } = sheet('📊 Criar enquete'); bg.id = 'pollsheet';
  const pick = (row) => { // botão 🖼 + miniatura
    const st = { file: null }; const fi = el('input'); fi.type = 'file'; fi.accept = 'image/*'; fi.hidden = true; const btn = el('button', null, '🖼'); btn.type = 'button'; const th = el('span', 'pimg'); th.hidden = true;
    btn.onclick = () => fi.click();
    fi.onchange = () => { const f = fi.files[0]; fi.value = ''; if (!f) return; st.file = f; th.textContent = ''; const im = el('img'); im.src = URL.createObjectURL(f); th.append(im); th.hidden = false; };
    th.onclick = () => { st.file = null; th.hidden = true; };
    row.append(th, btn, fi); return st;
  };
  let row = el('div', 'prow'); const q = el('input'); q.type = 'text'; q.placeholder = 'Pergunta'; q.maxLength = 200; row.append(q); const qimg = pick(row); box.append(row);
  const list = el('div'); box.append(list); const rows = [];
  const addRow = () => { if (rows.length >= 12) return; row = el('div', 'prow'); const i = el('input'); i.type = 'text'; i.placeholder = 'Opção ' + (rows.length + 1); i.maxLength = 120; row.append(i); const st = pick(row); const x = el('button', null, '✕'); row.append(x); list.append(row); const item = { i, st, r: row }; rows.push(item); x.onclick = () => { if (rows.length <= 2) { i.value = ''; st.file = null; item.r.querySelector('.pimg').hidden = true; return; } item.r.remove(); rows.splice(rows.indexOf(item), 1); rows.forEach((z, k) => { z.i.placeholder = 'Opção ' + (k + 1); }); }; };
  addRow(); addRow();
  const add = el('button', 'btn', '＋ Opção'); add.onclick = addRow; box.append(add);
  const k1 = el('label'); const r1 = el('input'); r1.type = 'radio'; r1.name = 'pk'; r1.checked = true; k1.append(r1, ' Uma escolha');
  const k2 = el('label'); const r2 = el('input'); r2.type = 'radio'; r2.name = 'pk'; k2.append(r2, ' Várias escolhas');
  const k3 = el('label'); const an = el('input'); an.type = 'checkbox'; k3.append(an, ' Voto anônimo');
  box.append(k1, k2, k3);
  const err = el('div', 'err'); box.append(err);
  const go = el('button', 'btn', 'Enviar enquete'); box.append(go);
  let busy = false;
  go.onclick = async () => {
    if (busy) return;
    const question = q.value.trim().replace(/\s+/g, ' ');
    const items = rows.map((z) => ({ text: z.i.value.trim().replace(/\s+/g, ' '), file: z.st.file })).filter((z) => z.text || z.file);
    if (!question) { err.textContent = 'Escreva a pergunta.'; return; }
    if (items.length < 2) { err.textContent = 'Coloque pelo menos 2 opções (texto e/ou imagem).'; return; }
    const named = items.filter((z) => z.text); if (new Set(named.map((z) => z.text.toLowerCase())).size !== named.length) { err.textContent = 'Há opções repetidas.'; return; }
    busy = true; go.disabled = true; err.textContent = '';
    try {
      const total = items.filter((z) => z.file).length + (qimg.file ? 1 : 0); let n = 0;
      const up = async (f) => { n++; err.textContent = `Enviando imagem ${n} de ${total}…`; return pollUpload(f); };
      const qi = qimg.file ? await up(qimg.file) : null;
      const mark = r2.checked ? '[ ]' : '( )'; const lines = [];
      for (const it of items) { const im = it.file ? await up(it.file) : null; lines.push(`- ${mark} ${im ? `![${im.alt}](${im.src}) ` : ''}${it.text || im.alt || 'imagem'}`); }
      const text = '```enquete' + (an.checked ? ' anonima' : '') + '\n' + question + '\n' + (qi ? `![${qi.alt}](${qi.src})\n` : '') + lines.join('\n') + '\n```';
      bg.remove();
      await api('POST', `/api/notes/${S.open.nid}/segments`, { text, replyTo: reply ? reply.id : threadTarget() });
      clearReply(); await loadNote(); const l = $('#list'); l.scrollTop = l.scrollHeight;
    } catch (e) { busy = false; go.disabled = false; err.textContent = e.message || 'Falhou'; }
  };
  q.focus();
};
let sending = false; // Enter/toque repetido não duplica a mensagem
async function sendMsg() {
  const o = S.open; const text = msg.value.replace(/\s+$/, ''); if (!o || !text.trim() || sending) return;
  sending = true; $('#send').disabled = true;
  const replyTo = reply ? reply.id : threadTarget();
  msg.value = ''; grow(); closeMention(); // esvazia na hora; volta se falhar
  let r = null;
  try { r = await guard(() => api('POST', `/api/notes/${o.nid}/segments`, { text, replyTo })); }
  finally { sending = false; $('#send').disabled = false; }
  if (r) { clearReply(); await loadNote(); const l = $('#list'); l.scrollTop = l.scrollHeight; }
  else { msg.value = msg.value ? text + '\n' + msg.value : text; grow(); }
}
$('#att').onclick = () => $('#fa').click();
$('#cam').onclick = () => $('#fc').click();
$('#fa').onchange = (e) => { attachModal([...e.target.files]); e.target.value = ''; };
$('#fc').onchange = (e) => { attachModal([...e.target.files]); e.target.value = ''; };
msg.addEventListener('paste', (e) => { const hasText = !!((e.clipboardData && e.clipboardData.getData('text/plain')) || '').trim(); const fs = hasText ? [] : [...(e.clipboardData ? e.clipboardData.files : [])]; if (fs.length) { e.preventDefault(); attachModal(fs); } });
function attachModal(files) {
  const o = S.open; if (!o || !files.length || $('#att-ov')) return;
  const items = []; let cur = 0; let busy = false;
  const pre = msg.value;
  const ov = el('div'); ov.id = 'att-ov';
  const top = el('div', 'top'); const x = el('button', null, '✕'); top.append(x);
  const stage = el('div', 'stage'); const bot = el('div', 'bot');
  const cap = el('input', 'cap'); cap.placeholder = 'Digite uma mensagem'; cap.value = pre;
  const foot = el('div', 'foot'); const strip = el('div', 'strip'); const go = el('button', 'go', '➤'); foot.append(strip, go);
  const am = el('div', 'am'); bot.append(cap, foot, am); ov.append(top, stage, bot);
  const fi = document.createElement('input'); fi.type = 'file'; fi.multiple = true; fi.hidden = true;
  const add = (list) => { const first = items.length; for (const f of list) { const it = { f, name: f.name || (f.type.startsWith('image/') ? 'foto.png' : 'arquivo'), img: f.type.startsWith('image/'), url: '' }; items.push(it); if (it.img) { const r = new FileReader(); r.onload = () => { it.url = String(r.result); draw(); }; r.readAsDataURL(f); } } if (list.length) cur = first; draw(); };
  fi.onchange = () => { add([...fi.files]); fi.value = ''; };
  function draw() {
    stage.textContent = ''; strip.textContent = '';
    const it = items[cur];
    if (it) { if (it.img && it.url) { const im = el('img'); im.src = it.url; im.alt = ''; stage.append(im); } else { const b = el('div'); b.append(el('div', 'ico', it.img ? '🖼' : it.f.type.startsWith('video/') ? '🎞' : '📎'), el('div', 'nm', it.name)); stage.append(b); } }
    items.forEach((m, i) => { const t = el('button', 'th' + (i === cur ? ' on' : '')); if (m.img && m.url) { const im = el('img'); im.src = m.url; im.alt = ''; t.append(im); } else t.textContent = m.img ? '🖼' : '📎'; t.onclick = () => { cur = i; draw(); }; strip.append(t); });
    const plus = el('button', 'plus', '+'); plus.onclick = () => fi.click(); strip.append(plus);
  }
  const close = () => { ov.remove(); fi.remove(); };
  x.onclick = () => { if (!busy) close(); };
  async function doSend() {
    if (busy || !items.length) return; busy = true; go.disabled = true;
    try {
      const lines = [];
      for (let i = 0; i < items.length; i++) {
        const f = items[i].f; const name = items[i].name; am.textContent = `Enviando ${i + 1} de ${items.length}…`;
        const r = await fetch(`/api/projects/${o.pid}/files?name=${encodeURIComponent(name)}`, { method: 'POST', headers: { Authorization: 'Bearer ' + S.token, 'Content-Type': f.type || 'application/octet-stream' }, body: f });
        const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Falha no envio');
        lines.push(f.type.startsWith('image/') ? `![${name}](srv-file:${j.id})` : f.type.startsWith('video/') ? `![${name}](srv-file:${j.id}#video)` : `[${name}](srv-file:${j.id})`);
      }
      const text = lines.join('\n') + (cap.value.trim() ? '\n\n' + cap.value.trim() : '');
      await api('POST', `/api/notes/${o.nid}/segments`, { text, replyTo: reply ? reply.id : threadTarget() });
      if (msg.value === pre) { msg.value = ''; grow(); }
      clearReply(); close(); await loadNote(); const l = $('#list'); l.scrollTop = l.scrollHeight;
    } catch (e) { busy = false; go.disabled = false; am.textContent = e.message || 'Falhou'; }
  }
  go.onclick = doSend;
  cap.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing && !touch) { e.preventDefault(); doSend(); } else if (e.key === 'Escape' && !busy) close(); });
  document.body.append(ov, fi); add(files); if (!touch) cap.focus();
}
async function upload(files) {
  const o = S.open; if (!o || !files.length) return;
  for (const f of files) {
    $('#status').textContent = `Enviando ${f.name || 'arquivo'} (${Math.max(1, Math.round(f.size / 1024))} KB)…`;
    try {
      const name = f.name || (f.type.startsWith('image/') ? 'foto.png' : 'arquivo');
      const r = await fetch(`/api/projects/${o.pid}/files?name=${encodeURIComponent(name)}`, { method: 'POST', headers: { Authorization: 'Bearer ' + S.token, 'Content-Type': f.type || 'application/octet-stream' }, body: f });
      const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Falha no envio');
      const t = f.type.startsWith('image/') ? `![${name}](srv-file:${j.id})` : f.type.startsWith('video/') ? `![${name}](srv-file:${j.id}#video)` : `[${name}](srv-file:${j.id})`;
      msg.value = (msg.value ? msg.value + '\n' : '') + t;
    } catch (x) { toast(x.message); }
  }
  $('#status').textContent = 'Anexo pronto: toque em Enviar.'; grow(); msg.focus();
  setTimeout(() => { if ($('#status').textContent.startsWith('Anexo pronto')) $('#status').textContent = ''; }, 5000);
}

/* ───── tempo real ───── */
// Alguém (que você permitiu no app) chamou a sua atenção: a página treme, o celular vibra e aparece um aviso
function webNudge(ev) {
  const name = who(ev.from).name;
  document.body.classList.remove('nshake'); void document.body.offsetWidth; document.body.classList.add('nshake');
  setTimeout(() => document.body.classList.remove('nshake'), 900);
  try { if (navigator.vibrate) navigator.vibrate([200, 80, 200, 80, 300]); } catch { /* sem vibrar */ }
  document.getElementById('nbanner')?.remove();
  const d = el('div'); d.id = 'nbanner'; d.append(el('span', null, `📳 ${name} chamou a sua atenção`));
  if (ev.nid && ev.pid) { const b = el('button', null, 'Abrir'); b.onclick = () => { location.hash = `#/n/${ev.pid}/${ev.nid}`; d.remove(); }; d.append(b); }
  const x = el('button', null, '×'); x.onclick = () => d.remove(); d.append(x);
  document.body.append(d); setTimeout(() => d.remove(), 12000);
}
let es = null; let evTimer = null;
function closeEvents() { if (es) { es.close(); es = null; } }
function openEvents() {
  closeEvents();
  es = new EventSource('/api/events?t=' + encodeURIComponent(S.token));
  es.onopen = () => { $('#conn').classList.remove('off'); };
  es.onerror = () => { $('#conn').classList.add('off'); };
  es.onmessage = (m) => {
    let ev; try { ev = JSON.parse(m.data); } catch { return; }
    if (ev.type === 'presence') { S.online = new Set(ev.online); $('#onl').textContent = '👥 ' + S.online.size; return; }
    if (ev.type === 'nudge') { webNudge(ev); return; }
    if (ev.type === 'note' || ev.type === 'project') {
      clearTimeout(evTimer);
      evTimer = setTimeout(async () => {
        if (ev.type === 'project') { await guard(loadProjects); } else if (ev.pid) { await loadNotes(ev.pid); renderTree(); }
        if (S.open && (ev.type === 'project' || ev.nid === S.open.nid)) { if (S.open.editing) return; loadNote(); }
      }, 250);
    }
  };
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.token && !$('#app').hidden) { if (!es || es.readyState === 2) openEvents(); loadAll(); } });
$('#onl').onclick = () => {
  const { box } = sheet('Quem está online');
  const arr = [...S.users.values()].filter((u) => !u.removed).sort((a, b) => (S.online.has(b.id) - S.online.has(a.id)) || (b.lastSeen || 0) - (a.lastSeen || 0));
  for (const u of arr) { const d = el('div', 'ver'); const n = nameSpan(u.id); d.append(el('span', S.online.has(u.id) ? 'dot' : 'dot off'), n, '  ' + (S.online.has(u.id) ? 'online agora' : u.lastSeen ? 'visto ' + fmt(u.lastSeen) : 'nunca entrou')); box.append(d); }
};
